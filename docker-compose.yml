services:
  dadofit-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL is required. Run Docker Compose with --env-file .env.local}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?VITE_SUPABASE_PUBLISHABLE_KEY is required. Run Docker Compose with --env-file .env.local}
    container_name: dadofit-web
    ports:
      - "8781:80"
    restart: unless-stopped
