# Production overrides for the self-hosted stack.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d
#
# Differences from development:
#   * only the edge proxy publishes ports (80/443, automatic TLS);
#   * db, api and web are reachable only on the internal network;
#   * real SMTP (Mailpit disabled), secure cookies, two trusted proxy hops;
#   * resource limits and a backup service writing to BACKUP_DIR on the host.

services:
  edge:
    image: caddy:2.10.2-alpine
    # Binds 80/443: only that capability is kept.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required (e.g. app.dadofit.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for TLS certificates}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  db:
    ports: !reset []
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=500"]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      APP_PUBLIC_URL: https://${DOMAIN}
      AUTH_REQUIRE_EMAIL_CONFIRMATION: "true"
      AUTH_SECURE_COOKIES: "true"
      API_TRUST_PROXY_HOPS: "2"
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  web:
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  mailpit:
    profiles: ["disabled"]

  backup:
    image: postgres:18.4-alpine
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-dadofit}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./db/backup.sh:/usr/local/bin/dadofit-backup:ro
      - storage_data:/data/storage:ro
      - ${BACKUP_DIR:?BACKUP_DIR is required (host path, synced off-site)}:/backups
    entrypoint: ["sh", "/usr/local/bin/dadofit-backup", "--loop"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

volumes:
  caddy_data:
  caddy_config:
