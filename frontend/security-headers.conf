# Included in every location: nginx drops server-level add_header directives in
# any location that declares its own (SEC-06), so they live here instead.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Images and videos may come from partner/ad URLs (https). Scripts, styles,
# connections and frames are same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# HSTS is only sent when the request arrived over HTTPS (TLS terminates at the
# edge proxy in production, see infra/docker-compose.prod.yml).
add_header Strict-Transport-Security $hsts_header always;
