map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Access log without query strings or Referer: e-mail links (legacy ?token=,
# ?confirm=) and signed file URLs (?token=) must not end up in logs.
log_format dadofit_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream dadofit_api {
    server api:8782;
    keepalive 16;
}

server {
    # Unprivileged nginx (uid 101) cannot bind ports below 1024.
    listen 8080;
    absolute_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log dadofit_noquery;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- API (auth, data, files) ---
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 55m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_pass http://dadofit_api;
    }

    # The SPA shell must always be revalidated so a new image never leaves
    # browsers pointing at bundles that no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~ ^/(images|videos)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Hashed Vite bundles.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
